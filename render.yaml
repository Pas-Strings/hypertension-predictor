services:
  - type: web
    name: hypertension-predictor
    runtime: python
    repo: https://github.com/Pas-Strings/hypertension-predictor
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0