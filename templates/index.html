<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypertension Prediction System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }
        .info h3 {
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hypertension Prediction System</h1>
        <p class="subtitle">Machine Learning based health assessment</p>
        
        <form action="/predict" method="POST">
            <div class="form-group">
                <label>Age (years)</label>
                <input type="number" step="1" name="age" required placeholder="e.g., 45">
            </div>
            
            <div class="form-group">
                <label>BMI (Body Mass Index)</label>
                <input type="number" step="0.1" name="bmi" required placeholder="e.g., 24.5">
            </div>
            
            <div class="form-group">
                <label>Systolic BP (mmHg) - Top number</label>
                <input type="number" step="1" name="systolic_bp" required placeholder="e.g., 120">
            </div>
            
            <div class="form-group">
                <label>Diastolic BP (mmHg) - Bottom number</label>
                <input type="number" step="1" name="diastolic_bp" required placeholder="e.g., 80">
            </div>
            
            <div class="form-group">
                <label>Cholesterol (mg/dL)</label>
                <input type="number" step="1" name="cholesterol" required placeholder="e.g., 180">
            </div>
            
            <button type="submit">Predict Now</button>
        </form>

        <div class="info">
            <h3>About this system</h3>
            <p>This tool uses Machine Learning (Random Forest) trained on patient records to predict hypertension and classify associated conditions like diabetes and heart disease.</p>
            <p><strong>Try these test values for hypertension:</strong> Age 62, BMI 31, Systolic 155, Diastolic 98, Cholesterol 215</p>
        </div>
    </div>
-->
</body>
</html>
